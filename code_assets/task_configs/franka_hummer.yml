render_freq: 1
episode_num: 1
use_seed: false
save_freq: 30
embodiment: [franka-panda]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 0
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
  # Observer camera (third_view) configuration
  # Uncomment and modify to customize third_view camera perspective
  observer_camera:
    position: [-0.1, 0.20, 1.28]    # Camera position [x, y, z]
    forward: [0, -1, -1.02]         # Camera forward direction vector
    left: [1, 0, 0]                 # Camera left direction vector
    # width: 320                      # Image width (pixels)
    # height: 240                     # Image height (pixels)
    # fovy: 93                        # Field of view (degrees)
    width: 1280   # 720p，清晰度和性能的平衡
    height: 720
    fovy: 93      # 适中的视场角
data_type:
  rgb: true
  third_view: true
  depth: false
  pointcloud: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 1
collect_data: true
eval_video_log: true
save_on_failure: true  # 设置为 true 时，即使任务失败也会保存数据
# Cube pose configuration (optional)
# If specified, cube will use this fixed pose instead of random generation
# Uncomment and modify to use fixed cube position
cube_pose:
  position: [0.3, 0.05, 0.76]    # Cube position [x, y, z] in meters
  quaternion: [1, 0, 0, 0]        # Cube orientation quaternion [w, x, y, z] format
